[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marauder"
dynamic = ["version"]
description = "Build .usmap mapping files for Unreal Engine games from the installed files, without running the game."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anastasios Antoniadis" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.9,<2",
  "capstone==5.0.3",
  "cryptography>=42",
]
keywords = ["unreal-engine", "usmap", "mappings", "modding", "cue4parse", "fmodel"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
marauder = "usmap_generator.cli:main"

[project.urls]
Homepage = "https://sourcemined.com"
Repository = "https://github.com/anantoni/marauder"
Issues = "https://github.com/anantoni/marauder/issues"

[tool.setuptools.dynamic]
version = { attr = "usmap_generator.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usmap_generator = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
"src/usmap_generator/engine/*" = ["F401", "F811", "F841"]
"tests/*" = ["F401", "F811", "F841"]
